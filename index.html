function s2StandingsThrough(season, nRaces) {
const HUMAN = { "15": 1, "27": 1 };
const orders = season.fullOrders || {};
const stages = season.stages || [];
const mll = season.mll || [];
const acc = {};
const ensure = (c) => { if (!acc[c]) acc[c] = { pts: 0, raceW: 0 }; };
for (let r = 1; r <= nRaces; r++) {
const o = orders[String(r)];
if (!o) continue;
for (let i = 0; i < o.length; i++) { const c = o[i]; ensure(c); const n = i + 1; acc[c].pts += (n === 1 ? (HUMAN[c] ? 40 : 55) : (41 - n)); }
ensure(o[0]); acc[o[0]].raceW += 1;
const st = stages[r - 1] || {};
["s1", "s2", "s3"].forEach((k) => { const arr = st[k]; if (!arr) return; arr.slice(0, 3).forEach((c, idx) => { if (HUMAN[c]) return; ensure(c); acc[c].pts += [10, 9, 8][idx]; }); });
const m = mll[r - 1]; if (m) { ensure(m); acc[m].pts += 5; }
}
return acc;
}
function s2ChaseThrough(season, nRaces) {
const lock = season.chaseLock;
if (!lock) return null;
const HUMAN = { "15": 1, "27": 1 };
const orders = season.fullOrders || {};
const stages = season.stages || [];
const mll = season.mll || [];
const fieldCars = new Set(lock.field.map(f => f.car));
const acc = {};
lock.field.forEach(f => { acc[f.car] = { pts: f.seed, raceW: 0, earned: 0, seed: f.seed }; });
const from = lock.race + 1;
for (let r = from; r <= nRaces; r++) {
const o = orders[String(r)];
if (!o) continue;
for (let i = 0; i < o.length; i++) {
const c = o[i]; if (!fieldCars.has(c)) continue;
const n = i + 1; const g = (n === 1 ? (HUMAN[c] ? 40 : 55) : (41 - n));
acc[c].pts += g; acc[c].earned += g;
}
if (o[0] && fieldCars.has(o[0])) acc[o[0]].raceW += 1;
const st = stages[r - 1] || {};
["s1", "s2", "s3"].forEach((k) => { const arr = st[k]; if (!arr) return; arr.slice(0, 3).forEach((c, idx) => { if (HUMAN[c] || !fieldCars.has(c)) return; const g = [10, 9, 8][idx]; acc[c].pts += g; acc[c].earned += g; }); });
const m = mll[r - 1]; if (m && fieldCars.has(m)) { acc[m].pts += 5; acc[m].earned += 5; }
}
return acc;
}

function buildOwnerPoints(data) {
const meta = data.meta || {}; const teams = meta.teams || {};

const s2 = data.seasons["2"]; const s1 = data.seasons["1"];
const nameByCar2 = {}; (s2.drivers || []).forEach(d => { nameByCar2[d.car] = d; });
function computeSeries(orders, teamOf, N) {
const owner = {};
const ensure = (t) => { if (!owner[t]) owner[t] = { pts: 0, wins: 0, races: 0 }; };
for (let r = 1; r <= N; r++) {
const order = orders(r);
if (!order) continue;
const bestByTeam = {};
order.forEach((c, i) => {
const team = teamOf(c) || "Independent";
const pts = posPts(c, i + 1);
if (!bestByTeam[team] || pts > bestByTeam[team].pts) bestByTeam[team] = { pts, car: c, pos: i + 1 };
});
Object.keys(bestByTeam).forEach(team => {
ensure(team); owner[team].pts += bestByTeam[team].pts; owner[team].races++;
if (bestByTeam[team].pos === 1) owner[team].wins++;
});
}
return owner;
}
const s2owner = computeSeries((r) => (s2.fullOrders || {})[String(r)], (c) => teams[c], (s2.tracks || []).length);
const s1RaceOrders = {}; const s1map = (c) => c === "87" ? "27" : c === "24" ? "15" : c;
Object.keys(s1.profiles || {}).forEach(car => {
(s1.profiles[car].fins || []).forEach(([race, pos]) => { (s1RaceOrders[race] = s1RaceOrders[race] || [])[pos - 1] = s1map(car); });
});
const s1N = (s1.index || []).length;
const s1owner = computeSeries((r) => s1RaceOrders[r], (c) => teams[s1map === null ? c : c] || teams[c], s1N);
const carsOf = (team) => Object.keys(teams).filter(c => teams[c] === team);
const toRows = (ownerMap) => Object.keys(ownerMap).map(team => ({ team, ...ownerMap[team], cars: carsOf(team) })).sort((a, b) => b.pts - a.pts);
return { "2": toRows(s2owner), "1": toRows(s1owner) };
}

function powerRankingText(data, ratings, registry) {
const hist = data.ratingsHistory || [];
const ref = hist.length >= 1 ? hist[hist.length - 1] : null;
if (!ref) return null;
const live = ratings.all.overall;
const pids = Object.keys(live);
const nameOf = (pid) => (registry[pid] ? registry[pid].name : "#" + pid);
let riser = null, faller = null;
pids.forEach(pid => {
const d = live[pid] - (ref.all[pid] != null ? ref.all[pid] : live[pid]);
if (!riser || d > riser.d) riser = { pid, d };
if (!faller || d < faller.d) faller = { pid, d };
});
const top = [...pids].sort((a, b) => live[b] - live[a])[0];
const s2 = data.seasons["2"].drivers;
const leader = s2[0], p2 = s2[1];
const bits = [];
bits.push(`#${top} ${nameOf(top)} tops the league at ${live[top]} OVR.`);
if (riser && riser.d > 0) bits.push(`Biggest riser: #${riser.pid} ${nameOf(riser.pid)} (+${riser.d}).`);
if (faller && faller.d < 0) bits.push(`Sliding: #${faller.pid} ${nameOf(faller.pid)} (${faller.d}).`);
if (leader && p2) bits.push(`Up front, #${leader.car} ${leader.name} leads #${p2.car} ${p2.name} by ${leader.pts - p2.pts} pts.`);
return { window: `Since ${ref.label}`, text: bits.join(" ") };
}
