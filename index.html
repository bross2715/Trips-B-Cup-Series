function s2StandingsThrough(season, nRaces) {
const HUMAN = { "15": 1, "27": 1 };
const orders = season.fullOrders || {};
const stages = season.stages || [];
const mll = season.mll || [];
const acc = {};
const ensure = (c) => { if (!acc[c]) acc[c] = { pts: 0, raceW: 0 }; };
for (let r = 1; r <= nRaces; r++) {
const o = orders[String(r)];
if (!o) continue;
for (let i = 0; i < o.length; i++) { const c = o[i]; ensure(c); const n = i + 1; acc[c].pts += (n === 1 ? (HUMAN[c] ? 40 : 55) : (41 - n)); }
ensure(o[0]); acc[o[0]].raceW += 1;
const st = stages[r - 1] || {};
["s1", "s2", "s3"].forEach((k) => { const arr = st[k]; if (!arr) return; arr.slice(0, 3).forEach((c, idx) => { if (HUMAN[c]) return; ensure(c); acc[c].pts += [10, 9, 8][idx]; }); });
const m = mll[r - 1]; if (m) { ensure(m); acc[m].pts += 5; }
}
return acc;
}
function s2ChaseThrough(season, nRaces) {
const lock = season.chaseLock;
if (!lock) return null;
const HUMAN = { "15": 1, "27": 1 };
const orders = season.fullOrders || {};
const stages = season.stages || [];
const mll = season.mll || [];
const fieldCars = new Set(lock.field.map(f => f.car));
const acc = {};
lock.field.forEach(f => { acc[f.car] = { pts: f.seed, raceW: 0, earned: 0, seed: f.seed }; });
const from = lock.race + 1;
for (let r = from; r <= nRaces; r++) {
const o = orders[String(r)];
if (!o) continue;
for (let i = 0; i < o.length; i++) {
const c = o[i]; if (!fieldCars.has(c)) continue;
const n = i + 1; const g = (n === 1 ? (HUMAN[c] ? 40 : 55) : (41 - n));
acc[c].pts += g; acc[c].earned += g;
}
if (o[0] && fieldCars.has(o[0])) acc[o[0]].raceW += 1;
const st = stages[r - 1] || {};
["s1", "s2", "s3"].forEach((k) => { const arr = st[k]; if (!arr) return; arr.slice(0, 3).forEach((c, idx) => { if (HUMAN[c] || !fieldCars.has(c)) return; const g = [10, 9, 8][idx]; acc[c].pts += g; acc[c].earned += g; }); });
const m = mll[r - 1]; if (m && fieldCars.has(m)) { acc[m].pts += 5; acc[m].earned += 5; }
}
return acc;
}

<NumberChip car={r.car} primary={r.col.primary} number={r.col.number} plate={r.col.plate} size="sm" />
<div style={{ fontSize: 13.5, fontWeight: 700, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.name}</div>
<div style={{ textAlign: "right" }}><span className="tbcs-font-display" style={{ fontSize: 17, fontWeight: 700, color: t.k ? t.c : C.text }}>{r.ovr}</span></div>
<div className="tbcs-font-mono" style={{ textAlign: "right", fontSize: 12, fontWeight: 700, color: r.mv == null ? C.muted : r.mv > 0 ? C.greenBright : r.mv < 0 ? C.red : C.muted, minWidth: 34 }}>
{r.mv == null ? "\u2013" : r.mv > 0 ? `\u25b2${r.mv}` : r.mv < 0 ? `\u25bc${Math.abs(r.mv)}` : "\u2013"}
</div>
</div>
);
})}
</div>
<div style={{ fontSize: 10.5, color: C.muted, fontStyle: "italic", padding: "0 4px" }}>Overall updates every race; \u00b1 shows change since the last ratings update ({ref ? ref.label : "\u2014"}).</div>
</div>
);
}
function AdminModal({ data, onClose, onApply }) {
const [text, setText] = useState(""); const [error, setError] = useState(""); const [copied, setCopied] = useState(false);
const handleApply = () => { try { const parsed = JSON.parse(text);
if (!parsed || typeof parsed !== "object") throw new Error("Invalid JSON.");
if (!(parsed.seasons || parsed.meta || parsed.seasonList)) throw new Error("Paste a race update or archive file (must include 'seasons').");
setError(""); onApply(parsed);
} catch (e) { setError(e.message || "Invalid JSON."); } };
const copyTemplate = () => { setText(JSON.stringify(data, null, 2)); setCopied(true); setTimeout(() => setCopied(false), 1500); };
return (<div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
<div onClick={(e) => e.stopPropagation()} className="tbcs-font-body" style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 16, width: "100%", maxWidth: 480, maxHeight: "85vh", display: "flex", flexDirection: "column" }}>
<div style={{ padding: "16px 18px", borderBottom: `1px solid ${C.line}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}><div className="tbcs-font-display" style={{ fontSize: 17, fontWeight: 700 }}>Commissioner: Update Data</div><button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={20} color={C.muted} /></button></div>
<div style={{ padding: 18, overflowY: "auto" }}>
<div style={{ fontSize: 12, color: C.muted, marginBottom: 10, lineHeight: 1.5 }}>Paste a race-update file (small) OR the Season 1 archive and tap Apply. Updates merge — you never need to paste everything at once. Everyone with the link sees it instantly.</div>
<button onClick={copyTemplate} className="tbcs-font-body" style={{ fontSize: 12, fontWeight: 700, color: C.greenBright, background: "rgba(0,145,63,0.12)", border: `1px solid rgba(0,145,63,0.4)`, borderRadius: 8, padding: "6px 10px", marginBottom: 10, cursor: "pointer" }}>{copied ? "Copied current data ✓" : "Load current data as template"}</button>
<textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Paste full payload JSON…" className="tbcs-font-mono tbcs-scrollbar" style={{ width: "100%", height: 220, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 8, color: C.text, fontSize: 11, padding: 10, resize: "vertical" }} />
{error && <div style={{ color: C.red, fontSize: 12, marginTop: 8 }}>{error}</div>}
</div>
<div style={{ padding: 16, borderTop: `1px solid ${C.line}`, display: "flex", gap: 8 }}>
<button onClick={onClose} className="tbcs-font-body" style={{ flex: 1, padding: "10px", borderRadius: 8, background: C.panel2, color: C.muted, border: `1px solid ${C.line}`, cursor: "pointer", fontWeight: 700 }}>Cancel</button>
<button onClick={handleApply} className="tbcs-font-body" style={{ flex: 1, padding: "10px", borderRadius: 8, background: C.green, color: "#fff", border: "none", cursor: "pointer", fontWeight: 700 }}>Apply Update</button>
</div>
</div>
</div>);
}
function App() {
const [data, setData] = useState(SEED_PAYLOAD);
const [season, setSeason] = useState(SEED_PAYLOAD.currentSeason || "2");
const [tab, setTab] = useState("tower");
const [selectedRace, setSelectedRace] = useState((SEED_PAYLOAD.seasons["2"].tracks.length) - 1);
const [modal, setModal] = useState(null); // {pid, season}
const [adminOpen, setAdminOpen] = useState(false);
const [seasonMenu, setSeasonMenu] = useState(false);
const [loaded, setLoaded] = useState(false);
const [toast, setToast] = useState("");
useEffect(() => {
(async () => {
try { const res = await window.storage.get(STORAGE_KEY, true);
if (res && res.value) {
const parsed = JSON.parse(res.value);
const sv = (SEED_PAYLOAD && SEED_PAYLOAD.version) || 0;
const pv = (parsed && parsed.version) || 0;
const valid = parsed && parsed.seasons && parsed.seasons["2"] && Array.isArray(parsed.seasons["2"].tracks);
if (valid && pv > sv) { setData(parsed); setSelectedRace(parsed.seasons["2"].tracks.length - 1); }
}
} catch (e) {}
setLoaded(true);
})();
}, []);
const applyUpdate = useCallback(async (patch) => {
try {
const merged = deepMerge(data, patch);
await window.storage.set(STORAGE_KEY, JSON.stringify(merged), true);
setData(merged);
if (merged.seasons && merged.seasons["2"] && merged.seasons["2"].tracks) setSelectedRace(merged.seasons["2"].tracks.length - 1);
setAdminOpen(false);
setToast("Data updated — everyone with the link sees it now."); setTimeout(() => setToast(""), 3500);
} catch (e) { setToast("Update failed to save."); setTimeout(() => setToast(""), 3500); }
}, [data]);
const registry = useMemo(() => buildRegistry(data), [data]);
const ratings = useMemo(() => computeRatings(registry, (data.seasons["2"].tracks || []).length), [registry, data]);
const sheet = useMemo(() => computeStatSheet(data, registry), [data, registry]);
const historical = season === "1";
const s1avg = useMemo(() => {
const m = {}; const prof = ((data.seasons["1"] || {}).profiles) || {};
Object.keys(prof).forEach(c => { m[c] = prof[c].avg; });
return m;
}, [data]);
const seasonObj = data.seasons[season];
const prevMap = data.seasons["2"].prevMap || {};
const tabs = historical ? [{ key: "tower", label: "Tower" }, { key: "chase", label: "Chase" }, { key: "ratings", label: "Ratings" }, { key: "trophy", label: "Trophy" }, { key: "owner", label: "Owner" }, { key: "leaders", label: "Leaders" }]
: [{ key: "tower", label: "Tower" }, { key: "chase", label: "Chase" }, { key: "stage", label: "Stage" }, { key: "ratings", label: "Ratings" }, { key: "trophy", label: "Trophy" }, { key: "owner", label: "Owner" }, { key: "leaders", label: "Leaders" }];
const activeTab = tabs.find(t => t.key === tab) ? tab : "tower";
const heroTitle = ({ tower: historical?"SEASON 1 ARCHIVE":"POINTS STANDINGS", chase: "CHASE TRACKER", stage: "STAGE POINTS", leaders: "LEAGUE LEADERS", ratings: "DRIVER RATINGS", owner: "OWNER STANDINGS", trophy: "TROPHY ROOM"}[activeTab]) || ({ tower: "POINTS STANDINGS", chase: "CHASE TRACKER", stage: "STAGE POINTS", leaders: "LEAGUE LEADERS", ratings: "DRIVER RATINGS", owner: "OWNER STANDINGS", trophy: "TROPHY ROOM"}[activeTab] || "POINTS STANDINGS");
const openDriver = (pid, s) => setModal({ pid, season: s });
return (<div className="tbcs-font-body" style={{ background: C.bg, minHeight: "100vh", color: C.text, paddingBottom: 90 }}>
<GlobalStyle /><CheckeredBar />
<div style={{ padding: "18px 16px 10px", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
<div style={{ minWidth: 0 }}>
<div className="tbcs-font-body" style={{ color: C.gold, fontSize: 12, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase" }}>Trips B Cup Series</div>
<div className="tbcs-font-display" style={{ fontSize: 30, fontWeight: 700, fontStyle: "italic", lineHeight: 1.05 }}>{heroTitle}</div>
</div>
<div style={{ position: "relative", flexShrink: 0 }}>
<button onClick={() => setSeasonMenu(!seasonMenu)} className="tbcs-font-body" style={{ display: "flex", alignItems: "center", gap: 6, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", cursor: "pointer", color: C.text, fontWeight: 700, fontSize: 11.5 }}>
<span style={{ color: C.muted, fontSize: 9.5, textTransform: "uppercase", letterSpacing: "0.05em" }}>Archive</span>
<span>{data.seasonList.find(s => s.id === season)?.label || "Season " + season}</span>
<ChevronDown size={14} color={C.muted} />
</button>
{seasonMenu && (<div style={{ position: "absolute", right: 0, top: "calc(100% + 6px)", background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", zIndex: 40, minWidth: 150, boxShadow: "0 8px 24px rgba(0,0,0,0.5)" }}>
<div style={{ padding: "8px 12px", fontSize: 9.5, color: C.muted, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 700, borderBottom: `1px solid ${C.line}` }}>Season Archives</div>
{data.seasonList.map(s => (<button key={s.id} onClick={() => { setSeason(s.id); setTab("tower"); setSeasonMenu(false); }} className="tbcs-font-body" style={{ width: "100%", textAlign: "left", padding: "10px 12px", background: season === s.id ? C.panel2 : "transparent", color: season === s.id ? C.gold : C.text, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 13, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
{s.label}{s.complete && <span style={{ fontSize: 9, color: C.muted, fontWeight: 600 }}>DONE</span>}</button>))}
</div>)}
</div>
</div>
<div className="tbcs-scrollbar" style={{ display: "flex", padding: "4px 16px 14px", gap: 6, overflowX: "auto" }}>
{tabs.map(t => (<button key={t.key} onClick={() => setTab(t.key)} className="tbcs-font-body" style={{ flexShrink: 0, whiteSpace: "nowrap", padding: "9px 13px", borderRadius: 9, fontWeight: 700, fontSize: 11.5, cursor: "pointer", background: activeTab === t.key ? C.gold : C.panel, color: activeTab === t.key ? "#111" : C.text, border: `1px solid ${activeTab === t.key ? C.gold : C.line}` }}>{t.label.toUpperCase()}</button>))}
</div>
<div style={{ padding: "0 14px 14px", maxWidth: 640, margin: "0 auto" }} onClick={() => seasonMenu && setSeasonMenu(false)}>
{!loaded ? (<div style={{ padding: 40, textAlign: "center", color: C.muted, fontSize: 13 }}>Loading…</div>) : (<>
{activeTab === "tower" && <TowerTab season={seasonObj} historical={historical} prevMap={prevMap} selectedRace={selectedRace} setSelectedRace={setSelectedRace} onOpenDriver={openDriver} />}
{activeTab === "chase" && <ChaseTab season={seasonObj} historical={historical} onOpenDriver={openDriver} />}
{activeTab === "stage" && !historical && <StageTab season={seasonObj} onOpenDriver={openDriver} />}
{activeTab === "ratings" && <RatingsTab data={data} ratings={ratings} registry={registry} sheet={sheet} archiveSeason={season} onOpenDriver={openDriver} />}
{activeTab === "trophy" && <TrophyRoomTab registry={registry} onOpenDriver={openDriver} />}
{activeTab === "owner" && <OwnerTab data={data} historical={historical} />}
{activeTab === "leaders" && <LeadersTab season={seasonObj} historical={historical} onOpenDriver={openDriver} />}
</>)}
</div>
<button onClick={() => setAdminOpen(true)} style={{ position: "fixed", bottom: 20, right: 20, width: 52, height: 52, borderRadius: 999, background: C.gold, border: "none", boxShadow: "0 4px 14px rgba(255,201,51,0.5)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", zIndex: 30 }}><Settings size={22} color="#111" /></button>
{toast && (<div style={{ position: "fixed", bottom: 82, left: "50%", transform: "translateX(-50%)", background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 14px", fontSize: 12, color: C.text, zIndex: 40, whiteSpace: "nowrap" }}>{toast}</div>)}
{modal && <DriverModal pid={modal.pid} registry={registry} ratings={ratings} sheet={sheet} initialSeason={modal.season} data={data} onClose={() => setModal(null)} />}
{adminOpen && <AdminModal data={data} onClose={() => setAdminOpen(false)} onApply={applyUpdate} />}
</div>);
}
if(typeof window.storage==="undefined"){window.storage={get:async(k)=>{try{const v=localStorage.getItem(k);return v?{value:v}:null}catch(e){return null}},set:async(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}return{value:v}}};}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script></body></html>
