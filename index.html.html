function deepMerge(base, patch) {
  if (Array.isArray(patch) || patch === null || typeof patch !== "object") return patch;
  const out = (base && typeof base === "object" && !Array.isArray(base)) ? { ...base } : {};
  for (const k of Object.keys(patch)) out[k] = deepMerge(out[k], patch[k]);
  return out;
}

function buildRegistry(data) {
  const S = data.seasons || {}; const meta = data.meta || {};
  const tt = (t) => (meta.trackType && meta.trackType[(t || "").trim()]) || "Intermediate";
  const s1 = S["1"] || {}; const s2 = S["2"] || {};
  const s1prof = s1.profiles || {}; const s1cmap = s1.colorMap || {};
  const s2byCar = {}; (s2.drivers || []).forEach(d => { s2byCar[d.car] = d; });
  const pidOf = (car) => (meta.s1PidMap && meta.s1PidMap[car]) || car;
  const avgOf = (arr) => Math.round(arr.reduce((a, b) => a + b, 0) / arr.length * 100) / 100;

  const s2finish = {};
  const fo = s2.fullOrders || {};
  Object.keys(fo).forEach(k => {
    const rn = parseInt(k, 10); const track = (s2.tracks || [])[rn - 1]; const type = tt(track);
    fo[k].forEach((car, i) => { (s2finish[car] = s2finish[car] || []).push({ race: rn, track, type, pos: i + 1 }); });
  });
  const s2high = {};
  for (let rn = 1; rn <= (s2.tracks || []).length; rn++) {
    const track = s2.tracks[rn - 1]; const w = (s2.winners || [])[rn - 1]; const m = (s2.mll || [])[rn - 1]; const st = (s2.stages || [])[rn - 1] || {};
    const add = (car, ev) => { if (!car) return; (s2high[car] = s2high[car] || []).push({ race: rn, track, ev }); };
    if (w) add(w, "Win"); if (m) add(m, "MLL");
    ["s1", "s2"].forEach((kk, si) => { (st[kk] || []).slice(0, 3).forEach((car, idx) => add(car, (si === 0 ? "S1" : "S2") + " P" + (idx + 1))); });
  }

  const pids = new Set();
  (s2.drivers || []).forEach(d => pids.add(d.car));
  Object.keys(s1prof).forEach(car => pids.add(pidOf(car)));

  const reg = {};
  pids.forEach(pid => {
    const s2d = s2byCar[pid];
    let s1car = null;
    if (pid === "27") s1car = "87";
    else if (pid === "15") s1car = "24";
    else if (pid === "87" || pid === "24") s1car = null;
    else if (s1prof[pid]) s1car = pid;
    const sp = s1car ? s1prof[s1car] : null;

    const name = s2d ? s2d.name : (sp ? sp.name : "#" + pid);
    const mfr = s2d ? s2d.manufacturer : "—";
    let colors = null;
    if (s2d) colors = { primary: s2d.primary, number: s2d.number, plate: !!s2d.plate, grad: s2d.cardGradient || [s2d.primary, s2d.secondary] };
    else if (s1car && s1cmap[s1car]) { const c = s1cmap[s1car]; colors = { primary: c.primary, number: c.number, plate: !!c.plate, grad: c.grad }; }
    let s1colors = null;
    if (s1car && s1cmap[s1car]) { const c = s1cmap[s1car]; s1colors = { primary: c.primary, number: c.number, plate: !!c.plate, grad: c.grad }; }

    const buckets = {};
    if (sp) (sp.log || []).forEach(x => { (buckets[x.type] = buckets[x.type] || []).push(x.pos); });
    (s2finish[pid] || []).forEach(x => { (buckets[x.type] = buckets[x.type] || []).push(x.pos); });
    const cavg = {}, ccnt = {};
    Object.keys(buckets).forEach(k => { cavg[k] = avgOf(buckets[k]); ccnt[k] = buckets[k].length; });

    const entry = { pid, name, team: (meta.teams || {})[pid] || null, mfr, notes: (meta.careerNotes || {})[pid] || [], colors, combinedTrackAvg: cavg, combinedTrackCount: ccnt };
    if (sp) entry.s1 = { car: s1car, colors: s1colors, profile: sp };
    if (s2d) {
      const s2avg = {};
      (s2finish[pid] || []).forEach(x => { (s2avg[x.type] = s2avg[x.type] || []).push(x.pos); });
      const ta = {}, tc = {};
      Object.keys(s2avg).forEach(k => { ta[k] = avgOf(s2avg[k]); tc[k] = s2avg[k].length; });
      entry.s2 = { car: pid, colors, agg: { rank: s2d.rank, pts: s2d.pts, raceW: s2d.raceW, stageW: s2d.stageW, t5: s2d.t5, t10: s2d.t10, avg: s2d.avg, sp: s2d.sp, mll: s2d.mll }, highlights: s2high[pid] || [], finishes: s2finish[pid] || [], trackAvg: ta, trackCount: tc };
    }
    reg[pid] = entry;
  });
  return reg;
}

/* ---------- Track-type strength bars ---------- */
function TrackTypeBars({ trackTypeAvg, trackTypeCount }) {
  const entries = TYPE_ORDER.filter(t => trackTypeAvg && trackTypeAvg[t] !== undefined);
  if (entries.length === 0) return <div style={{ fontSize: 12, color: C.muted }}>No track-type data yet.</div>;
  const strength = (avg) => Math.max(0.04, Math.min(1, (41 - avg) / 40));
  const barColor = (avg) => avg <= 10 ? C.greenBright : avg <= 18 ? C.gold : avg <= 26 ? "#E8913C" : C.red;
  return (<div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
    {entries.map(t => {
      const avg = trackTypeAvg[t]; const cnt = trackTypeCount ? trackTypeCount[t] : null;
      return (<div key={t}>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11.5, marginBottom: 3 }}>
          <span style={{ color: C.text, fontWeight: 600 }}>{t}{cnt ? ` · ${cnt}` : ""}</span>
          <span className="tbcs-font-mono" style={{ color: C.muted }}>avg {avg.toFixed(1)}</span>
        </div>
        <div style={{ height: 8, background: C.panel2, borderRadius: 999, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${strength(avg) * 100}%`, background: barColor(avg), borderRadius: 999 }} />
        </div>
      </div>);
    })}
  </div>);
}

    </div>
  );
}

/* ---------- Race navigator (S2 live) ---------- */
function RaceNavigator({ tracks, selected, onSelect }) {
  const last = tracks.length - 1;
  return (<div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: "14px 16px" }}>
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10 }}>
      <button onClick={() => onSelect(Math.max(0, selected - 1))} disabled={selected === 0} style={{ width: 36, height: 36, borderRadius: 9, background: C.panel2, border: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: selected === 0 ? "default" : "pointer", opacity: selected === 0 ? 0.4 : 1 }}><ChevronLeft size={18} color={C.text} /></button>
      <div style={{ textAlign: "center", flex: 1 }}>
        <div className="tbcs-font-body" style={{ fontSize: 10, color: C.muted, textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Standings Through</div>
        <div className="tbcs-font-display" style={{ fontSize: 19, fontWeight: 700, fontStyle: "italic", color: C.text }}>RACE {selected + 1} <span style={{ color: C.gold }}>· {tracks[selected].toUpperCase()}</span></div>
      </div>
      <button onClick={() => onSelect(Math.min(last, selected + 1))} disabled={selected === last} style={{ width: 36, height: 36, borderRadius: 9, background: C.panel2, border: `1px solid ${C.line}`, display: "flex", alignItems: "center", justifyContent: "center", cursor: selected === last ? "default" : "pointer", opacity: selected === last ? 0.4 : 1 }}><ChevronRight size={18} color={C.text} /></button>
    </div>
    <input type="range" min={0} max={last} value={selected} onChange={(e) => onSelect(Number(e.target.value))} className="tbcs-slider" style={{ width: "100%", marginTop: 14 }} />
    <div className="tbcs-font-mono" style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, color: C.muted, marginTop: 6 }}><span>R1</span><span>R{Math.round((last + 1) / 2)}</span><span>R{last + 1}</span></div>
  </div>);
}

/* ---------- Pretty recap strip ---------- */
function RecapStrip({ mllCar, s1arr, s2arr }) {
  const Pod = ({ label, arr }) => (
    <div style={{ flex: 1, minWidth: 130 }}>
      <div className="tbcs-font-body" style={{ fontSize: 9.5, color: C.muted, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 700, marginBottom: 5 }}>{label}</div>
      <div style={{ display: "flex", gap: 5 }}>
        {arr.slice(0, 3).map((car, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 4, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 7, padding: "3px 7px" }}>
            <span className="tbcs-font-mono" style={{ fontSize: 9, color: [C.gold, "#C9CDd3", "#C8813C"][i], fontWeight: 700 }}>{i + 1}</span>
            <span className="tbcs-font-display" style={{ fontSize: 12, fontWeight: 700, color: C.text }}>#{car}</span>
          </div>
        ))}
      </div>
    </div>

      <div style={{ display: "flex", alignItems: "center", gap: 6, background: "rgba(255,201,51,0.14)", border: `1px solid rgba(255,201,51,0.4)`, borderRadius: 999, padding: "3px 10px" }}>
        <Zap size={13} color={C.gold} /><span className="tbcs-font-body" style={{ fontSize: 11, color: C.gold, fontWeight: 700 }}>Most Laps Led</span>
        <span className="tbcs-font-display" style={{ fontSize: 13, color: "#fff", fontWeight: 700 }}>#{mllCar}</span>
      </div>
    </div>
    <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}><Pod label="Stage 1" arr={s1arr} /><Pod label="Stage 2" arr={s2arr} /></div>
  </div>);
}

/* ---------- TOWER (works for live S2 and historical S1) ---------- */
function TowerTab({ season, historical, prevMap, selectedRace, setSelectedRace, onOpenDriver }) {
  const [expanded, setExpanded] = useState(false);
  const [showIndex, setShowIndex] = useState(false);

  if (historical) {
    const rows = season.standings;
    const champ = rows[0];
    const visible = expanded ? rows : rows.slice(0, 16);
    return (<div className="tbcs-font-body" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      <div style={{ background: `linear-gradient(135deg, ${champ.primary}, #0B0D0F)`, border: `1px solid ${C.line}`, borderRadius: 12, padding: 16, display: "flex", alignItems: "center", gap: 12 }}>
        <Crown size={26} color={C.gold} />
        <div><div className="tbcs-font-body" style={{ fontSize: 10, color: "rgba(255,255,255,0.85)", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Champion</div>
          <div className="tbcs-font-display" style={{ fontSize: 22, fontWeight: 700, fontStyle: "italic", color: "#fff" }}>#{champ.car} {champ.name}</div></div>
      </div>
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
        <div style={{ display: "grid", gridTemplateColumns: "34px 46px 1fr auto auto", gap: 8, padding: "8px 14px", borderBottom: `1px solid ${C.line}` }}>
          {["POS", "CAR", "DRIVER", "PTS", "AVG"].map((h, i) => <div key={h} className="tbcs-font-body" style={{ fontSize: 10, color: C.muted, fontWeight: 700, textAlign: i >= 3 ? "right" : "left" }}>{h}</div>)}
        </div>
        {visible.map((d, i) => (<React.Fragment key={d.car}>
          <div onClick={() => onOpenDriver(d.pid, "1")} style={{ display: "grid", gridTemplateColumns: "34px 46px 1fr auto auto", gap: 8, alignItems: "center", padding: "10px 14px", cursor: "pointer", borderLeft: `4px solid ${d.primary}`, background: i % 2 ? "rgba(255,255,255,0.015)" : "transparent", borderBottom: `1px solid ${C.line}` }}>
            <div className="tbcs-font-mono" style={{ fontSize: 15, fontWeight: 700, color: d.rank === 1 ? C.gold : C.text }}>{d.rank}</div>
            <NumberChip car={d.car} primary={d.primary} number={d.number} plate={d.plate} size="sm" />
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.name}</div>
              <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 2 }}><WinFlags count={d.wins} /></div>
            </div>
            <div style={{ textAlign: "right" }}>
              <div className="tbcs-font-display" style={{ fontSize: 16, fontWeight: 700, color: C.text }}>{d.pts}</div>
              <div className="tbcs-font-mono" style={{ fontSize: 9, color: C.muted }}>{d.ptsType === "chase" ? "chase" : "season"}</div>
            </div>
            <div className="tbcs-font-mono" style={{ textAlign: "right", fontSize: 12, color: C.muted }}>{d.avg.toFixed(1)}</div>
          </div>
          {d.rank === 12 && (<div style={{ padding: "8px 14px", background: "rgba(255,201,51,0.1)", borderTop: `2px dashed ${C.gold}`, borderBottom: `2px dashed ${C.gold}`, textAlign: "center", fontSize: 10, color: C.gold, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em" }}>▲ Chase Field (reset pts) — below: full-season pts ▼</div>)}
        </React.Fragment>))}
        <button onClick={() => setExpanded(!expanded)} className="tbcs-font-body" style={{ width: "100%", padding: "10px", background: C.panel2, color: C.muted, fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 4, border: "none", cursor: "pointer" }}>{expanded ? <>Show Top 16 <ChevronUp size={14} /></> : <>Show Full Field ({rows.length}) <ChevronDown size={14} /></>}</button>
      </div>
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
        <button onClick={() => setShowIndex(!showIndex)} className="tbcs-font-body" style={{ width: "100%", padding: "12px 14px", background: "transparent", border: "none", color: C.text, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
          <span className="tbcs-font-display" style={{ fontSize: 15, fontWeight: 700, fontStyle: "italic" }}>36-RACE INDEX</span>{showIndex ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
        </button>
        {showIndex && season.index.map((r) => {
          const col = season.colorMap[r.winner] || { primary: "#3A3F44", number: "#fff", plate: false };
          const pid = r.winner === "87" ? "27" : r.winner === "24" ? "15" : r.winner;
          return (<div key={r.race} onClick={() => r.winner !== "—" && onOpenDriver(pid, "1")} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 14px", borderTop: `1px solid ${C.line}`, cursor: "pointer" }}>
            <div className="tbcs-font-mono" style={{ width: 26, color: C.muted, fontSize: 12 }}>R{r.race}</div>
            <div style={{ flex: 1, minWidth: 0 }}><div style={{ fontSize: 13, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{r.track}</div>
              <div style={{ fontSize: 10.5, color: C.muted }}>{r.type}{r.field < 40 ? ` · ${r.field} cars` : ""}</div></div>
            <CheckerFlag size={11} /><NumberChip car={r.winner} primary={col.primary} number={col.number} plate={col.plate} size="sm" />
          </div>);
        })}
      </div>
    </div>);
  }

  // ---- Live S2 ----
  const drivers = season.drivers;
  const leader = drivers[0];
  const raceIdx = selectedRace;
  const rw = season.winners[raceIdx];
  const rwName = season.winnerNames[rw] || (drivers.find(d => d.car === rw) || {}).name || rw;
  const rwd = drivers.find(d => d.car === rw);
  const stages = season.stages[raceIdx] || { s1: [], s2: [] };
  const mllCar = season.mll[raceIdx];
  const hasPrev = Object.keys(prevMap).length > 0;
  let mover = null, faller = null;
  if (hasPrev) {
    const pr = [...drivers].map(d => ({ car: d.car, pts: prevMap[d.car] !== undefined ? prevMap[d.car] : d.pts })).sort((a, b) => b.pts - a.pts);
    const prm = {}; pr.forEach((d, i) => { prm[d.car] = i + 1; });
    const dl = drivers.map(d => ({ d, delta: (prm[d.car] || d.rank) - d.rank }));
    mover = [...dl].sort((a, b) => b.delta - a.delta)[0];
    faller = [...dl].sort((a, b) => a.delta - b.delta)[0];
    if (mover && mover.delta <= 0) mover = null;
    if (faller && faller.delta >= 0) faller = null;
  }
  const visible = expanded ? drivers : drivers.slice(0, 16);
  return (<div className="tbcs-font-body" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <RaceNavigator tracks={season.tracks} selected={selectedRace} onSelect={setSelectedRace} />
    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
      <StatCard car={leader.car} primary={leader.primary} number={leader.number} plate={leader.plate} label="Points Leader" value={leader.name} sub={`${leader.pts} pts`} />
      <StatCard car={rw} primary={rwd?.primary} number={rwd?.number} plate={rwd?.plate} label={`Race ${raceIdx + 1} Winner`} value={rwName} sub={season.tracks[raceIdx]} />
      <StatCard car={mover ? mover.d.car : null} primary={mover?.d.primary} number={mover?.d.number} plate={mover?.d.plate} label="Biggest Mover" value={mover ? mover.d.name : "—"} sub={mover ? `▲ ${mover.delta} to P${mover.d.rank}` : "—"} subColor={mover ? C.greenBright : undefined} />
      <StatCard car={faller ? faller.d.car : null} primary={faller?.d.primary} number={faller?.d.number} plate={faller?.d.plate} label="Biggest Faller" value={faller ? faller.d.name : "—"} sub={faller ? `▼ ${Math.abs(faller.delta)} to P${faller.d.rank}` : "—"} subColor={faller ? C.red : undefined} />
    </div>
    {(stages.s1.length > 0 || stages.s2.length > 0 || mllCar) && <RecapStrip mllCar={mllCar} s1arr={stages.s1} s2arr={stages.s2} />}
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
      <div style={{ display: "grid", gridTemplateColumns: "34px 22px 46px 1fr auto auto", gap: 8, padding: "8px 14px", borderBottom: `1px solid ${C.line}` }}>
        {["POS", "+/-", "CAR", "DRIVER", "PTS", "GAP"].map((h, i) => <div key={h} className="tbcs-font-body" style={{ fontSize: 10, color: C.muted, fontWeight: 700, textAlign: i >= 4 ? "right" : "left" }}>{h}</div>)}
      </div>
      {visible.map((d, i) => {
        const gap = leader.pts - d.pts; const prevPts = prevMap[d.car]; const pd = prevPts !== undefined ? d.pts - prevPts : null;
        let rd = null;
        if (hasPrev) { const pr = [...drivers].map(x => ({ car: x.car, pts: prevMap[x.car] !== undefined ? prevMap[x.car] : x.pts })).sort((a, b) => b.pts - a.pts); rd = (pr.findIndex(x => x.car === d.car) + 1) - d.rank; }
        return (<div key={d.car} onClick={() => onOpenDriver(d.pid, "2")} style={{ display: "grid", gridTemplateColumns: "34px 22px 46px 1fr auto auto", gap: 8, alignItems: "center", padding: "10px 14px", cursor: "pointer", borderLeft: `4px solid ${d.primary}`, background: i % 2 ? "rgba(255,255,255,0.015)" : "transparent", borderBottom: `1px solid ${C.line}` }}>
          <div className="tbcs-font-mono" style={{ fontSize: 15, fontWeight: 700, color: C.text }}>{d.rank}</div>
          <div className="tbcs-font-mono" style={{ fontSize: 11, fontWeight: 700, color: rd > 0 ? C.greenBright : rd < 0 ? C.red : C.muted }}>{rd === null || rd === 0 ? "–" : rd > 0 ? `▲${rd}` : `▼${Math.abs(rd)}`}</div>
          <NumberChip car={d.car} primary={d.primary} number={d.number} plate={d.plate} size="sm" />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.name}</div>
            <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 2, flexWrap: "wrap" }}><MfrTag m={d.manufacturer} /><WinFlags count={d.raceW} />{pd !== null && pd !== 0 && <span style={{ fontSize: 11, color: C.greenBright, fontWeight: 700 }}>+{pd}</span>}</div>
          </div>
          <div className="tbcs-font-display" style={{ textAlign: "right", fontSize: 17, fontWeight: 700, color: C.text }}>{d.pts}</div>
          <div className="tbcs-font-mono" style={{ textAlign: "right", fontSize: 10.5, color: C.muted }}>{gap === 0 ? "LEADER" : `-${gap}`}</div>
        </div>);
      })}
      <button onClick={() => setExpanded(!expanded)} className="tbcs-font-body" style={{ width: "100%", padding: "10px", background: C.panel2, color: C.muted, fontSize: 12, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center", gap: 4, border: "none", cursor: "pointer" }}>{expanded ? <>Show Top 16 <ChevronUp size={14} /></> : <>Show Full Field ({drivers.length}) <ChevronDown size={14} /></>}</button>
    </div>
  </div>);
}

/* ---------- CHASE ---------- */
function ChaseTab({ season, historical, onOpenDriver }) {
  if (historical) {
    return (<div className="tbcs-font-body" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <div style={{ background: `linear-gradient(135deg,#00913F,#0B3D22)`, borderRadius: 12, padding: 16 }}>
        <div style={{ fontSize: 11, color: "rgba(255,255,255,0.85)", textTransform: "uppercase", letterSpacing: "0.08em", fontWeight: 700 }}>Season 1 Champion</div>
        <div className="tbcs-font-display" style={{ fontSize: 24, fontWeight: 700, fontStyle: "italic", color: "#fff" }}>#{season.champion} {season.championName}</div>
        <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.85)" }}>Runner-Up: #{season.runnerUp} {season.runnerUpName}</div>
      </div>
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
        <div className="tbcs-font-display" style={{ padding: "12px 14px", borderBottom: `1px solid ${C.line}`, fontSize: 15, fontWeight: 700, fontStyle: "italic" }}>FINAL CHASE STANDINGS</div>
        {season.finalChase.map((row, i) => { const col = season.colorMap[row.car] || {}; const pid = row.car === "87" ? "27" : row.car === "24" ? "15" : row.car;
          return (<div key={row.car} onClick={() => onOpenDriver(pid, "1")} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 14px", borderLeft: `4px solid ${col.primary || "#3A3F44"}`, borderBottom: `1px solid ${C.line}`, cursor: "pointer" }}>
            <div className="tbcs-font-mono" style={{ width: 22, color: i === 0 ? C.gold : C.muted, fontSize: 14, fontWeight: 700 }}>{i + 1}</div>
            <NumberChip car={row.car} primary={col.primary || "#3A3F44"} number={col.number || "#fff"} plate={col.plate} size="sm" />
            <div style={{ flex: 1, fontSize: 13.5, fontWeight: 700 }}>{row.name}</div>
            <div className="tbcs-font-mono" style={{ fontWeight: 700 }}>{row.pts}</div></div>);
        })}
      </div>
      <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
        <div className="tbcs-font-display" style={{ padding: "12px 14px", borderBottom: `1px solid ${C.line}`, fontSize: 15, fontWeight: 700, fontStyle: "italic" }}>CHASE GRID (AFTER RACE 26)</div>
        {season.regGrid.map((row) => { const col = season.colorMap[row.car] || {}; const pid = row.car === "87" ? "27" : row.car === "24" ? "15" : row.car;
          return (<div key={row.car} onClick={() => onOpenDriver(pid, "1")} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 14px", borderLeft: `4px solid ${col.primary || "#3A3F44"}`, borderBottom: `1px solid ${C.line}`, cursor: "pointer" }}>
            <div className="tbcs-font-mono" style={{ width: 46, color: C.muted, fontSize: 12 }}>Seed {row.seed}</div>
            <NumberChip car={row.car} primary={col.primary || "#3A3F44"} number={col.number || "#fff"} plate={col.plate} size="sm" />
            <div style={{ flex: 1, fontSize: 13.5, fontWeight: 700 }}>{row.name}</div>
            <div className="tbcs-font-mono" style={{ fontWeight: 700, color: C.greenBright }}>{row.pts}</div></div>);
        })}
      </div>
    </div>);
  }
  const drivers = season.drivers;
  const chase = drivers.slice(0, 12); const bubble = drivers.slice(12, 16);
  const pc = drivers.slice(12).find(d => !d.human) || drivers[12];
  const cut = drivers[11].pts; const seeds = [75, 60, 55, 50, 45, 40, 35, 30, 25, 20, 15, 10];
  return (<div className="tbcs-font-body" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
      <div className="tbcs-font-display" style={{ fontSize: 16, fontWeight: 700, fontStyle: "italic", marginBottom: 4 }}>CHASE FIELD</div>
      <div style={{ fontSize: 12, color: C.muted }}>Top 12 after Race 26 make the Chase. No win-and-in, no eliminations.</div>
    </div>
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
      {chase.map((d, i) => (<div key={d.car} onClick={() => onOpenDriver(d.pid, "2")} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", borderLeft: `4px solid ${d.primary}`, borderBottom: `1px solid ${C.line}`, cursor: "pointer" }}>
        <div className="tbcs-font-mono" style={{ width: 20, color: C.muted, fontSize: 13 }}>{i + 1}</div>
        <NumberChip car={d.car} primary={d.primary} number={d.number} plate={d.plate} size="sm" />
        <div style={{ flex: 1 }}><div style={{ fontSize: 13.5, fontWeight: 700 }}>{d.name}</div><div style={{ fontSize: 11, color: C.muted, display: "flex", gap: 6, alignItems: "center" }}>{d.pts} pts <WinFlags count={d.raceW} /></div></div>
        <div className="tbcs-font-mono" style={{ color: C.greenBright, fontSize: 13, fontWeight: 700 }}>{seeds[i]} Pts</div></div>))}
      <div style={{ padding: "10px 14px", background: "rgba(255,201,51,0.1)", borderTop: `2px dashed ${C.gold}`, textAlign: "center", fontSize: 11, color: C.gold, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.05em" }}>▲ Chase Cutline — {cut} pts ▲</div>
      {bubble.map((d, i) => (<div key={d.car} onClick={() => onOpenDriver(d.pid, "2")} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 14px", borderLeft: `4px solid ${d.primary}`, borderBottom: `1px solid ${C.line}`, cursor: "pointer", opacity: 0.75 }}>
        <div className="tbcs-font-mono" style={{ width: 20, color: C.muted, fontSize: 13 }}>{i + 13}</div>
        <NumberChip car={d.car} primary={d.primary} number={d.number} plate={d.plate} size="sm" />
        <div style={{ flex: 1 }}><div style={{ fontSize: 13.5, fontWeight: 700 }}>{d.name}</div><div style={{ fontSize: 11, color: C.muted }}>{d.pts} pts · {cut - d.pts} out</div></div></div>))}
    </div>
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
      <div className="tbcs-font-display" style={{ fontSize: 15, fontWeight: 700, fontStyle: "italic", marginBottom: 8, display: "flex", alignItems: "center", gap: 6 }}><Trophy size={16} color={C.gold} /> PEOPLE'S CHAMP</div>
      <div onClick={() => onOpenDriver(pc.pid, "2")} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }}>
        <NumberChip car={pc.car} primary={pc.primary} number={pc.number} plate={pc.plate} />
        <div><div style={{ fontWeight: 700 }}>{pc.name}</div><div style={{ fontSize: 12, color: C.muted }}>P{pc.rank} · {pc.pts} pts</div></div></div>
    </div>
  </div>);
}

/* ---------- STAGE (S2 only) ---------- */
function StageTab({ season, onOpenDriver }) {
  const ranked = [...season.drivers].sort((a, b) => b.sp - a.sp);
  return (<div className="tbcs-font-body" style={{ display: "flex", flexDirection: "column", gap: 14 }}>
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, overflow: "hidden" }}>
      <div className="tbcs-font-display" style={{ padding: "12px 14px", borderBottom: `1px solid ${C.line}`, fontSize: 16, fontWeight: 700, fontStyle: "italic" }}>STAGE POINTS LEADERBOARD</div>
      {ranked.slice(0, 20).map((d, i) => (<div key={d.car} onClick={() => onOpenDriver(d.pid, "2")} style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 14px", borderLeft: `4px solid ${d.primary}`, borderBottom: `1px solid ${C.line}`, cursor: "pointer" }}>
        <div className="tbcs-font-mono" style={{ width: 20, color: C.muted, fontSize: 13 }}>{i + 1}</div>
        <NumberChip car={d.car} primary={d.primary} number={d.number} plate={d.plate} size="sm" />
        <div style={{ flex: 1, fontSize: 13.5, fontWeight: 700 }}>{d.name}</div>
        <div className="tbcs-font-mono" style={{ fontWeight: 700, color: C.greenBright }}>{d.sp}</div></div>))}
      <div style={{ padding: "10px 14px", fontSize: 11, color: C.muted, fontStyle: "italic", borderTop: `1px solid ${C.line}` }}>#15 and #27 always score zero stage points by rule.</div>
    </div>
  </div>);
}

/* ---------- LEADERS ---------- */
function LeaderCard({ title, icon, rows, valueKey, onOpenDriver }) {
  const sorted = [...rows].filter(d => d[valueKey] > 0).sort((a, b) => b[valueKey] - a[valueKey]).slice(0, 3);
  return (<div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
    <div className="tbcs-font-display" style={{ fontSize: 14, fontWeight: 700, marginBottom: 10, display: "flex", alignItems: "center", gap: 6 }}>{icon} {title}</div>
    {sorted.length === 0 && <div style={{ fontSize: 12, color: C.muted }}>No data.</div>}
    {sorted.map((d, i) => (<div key={d.car} onClick={() => onOpenDriver(d.pid, d._season)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", cursor: "pointer" }}>
      <div className="tbcs-font-mono" style={{ width: 16, color: i === 0 ? C.gold : C.muted, fontSize: 12, fontWeight: 700 }}>{i + 1}</div>
      <NumberChip car={d.car} primary={d.primary} number={d.number} plate={d.plate} size="sm" />
      <div style={{ flex: 1, fontSize: 12.5, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.name}</div>
      <div className="tbcs-font-mono" style={{ fontSize: 13, fontWeight: 700 }}>{d[valueKey]}</div></div>))}
  </div>);
}
function LeadersTab({ season, historical, onOpenDriver }) {
  const rows = (historical ? season.standings : season.drivers).map(d => ({ ...d, _season: historical ? "1" : "2", raceW: historical ? d.wins : d.raceW }));
  const bestAvg = [...rows].filter(d => d.avg > 0).sort((a, b) => a.avg - b.avg).slice(0, 3);
  return (<div className="tbcs-font-body" style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <LeaderCard title="Race Wins" icon={<Trophy size={15} color={C.gold} />} rows={rows} valueKey="raceW" onOpenDriver={onOpenDriver} />
    <LeaderCard title="Most Laps Led Bonuses" icon={<Flag size={15} color={C.gold} />} rows={rows} valueKey="mll" onOpenDriver={onOpenDriver} />
    {!historical && <LeaderCard title="Stage Points" icon={<Zap size={15} color={C.greenBright} />} rows={rows} valueKey="sp" onOpenDriver={onOpenDriver} />}
    <LeaderCard title="Top 5 Finishes" icon={<Trophy size={15} color={C.muted} />} rows={rows} valueKey="t5" onOpenDriver={onOpenDriver} />
    <LeaderCard title="Top 10 Finishes" icon={<Trophy size={15} color={C.muted} />} rows={rows} valueKey="t10" onOpenDriver={onOpenDriver} />
    <div style={{ background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: 14 }}>
      <div className="tbcs-font-display" style={{ fontSize: 14, fontWeight: 700, marginBottom: 10 }}>Best Average Finish</div>
      {bestAvg.map((d, i) => (<div key={d.car} onClick={() => onOpenDriver(d.pid, d._season)} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", cursor: "pointer" }}>
        <div className="tbcs-font-mono" style={{ width: 16, color: i === 0 ? C.gold : C.muted, fontSize: 12, fontWeight: 700 }}>{i + 1}</div>
        <NumberChip car={d.car} primary={d.primary} number={d.number} plate={d.plate} size="sm" />
        <div style={{ flex: 1, fontSize: 12.5, fontWeight: 700 }}>{d.name}</div>
        <div className="tbcs-font-mono" style={{ fontSize: 13, fontWeight: 700 }}>{d.avg.toFixed(2)}</div></div>))}
    </div>
  </div>);
}

/* ---------- ADMIN ---------- */
function AdminModal({ data, onClose, onApply }) {
  const [text, setText] = useState(""); const [error, setError] = useState(""); const [copied, setCopied] = useState(false);
  const handleApply = () => { try { const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== "object") throw new Error("Invalid JSON.");
    if (!(parsed.seasons || parsed.meta || parsed.seasonList)) throw new Error("Paste a race update or archive file (must include 'seasons').");
    setError(""); onApply(parsed);
  } catch (e) { setError(e.message || "Invalid JSON."); } };
  const copyTemplate = () => { setText(JSON.stringify(data, null, 2)); setCopied(true); setTimeout(() => setCopied(false), 1500); };
  return (<div onClick={onClose} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
    <div onClick={(e) => e.stopPropagation()} className="tbcs-font-body" style={{ background: C.bg, border: `1px solid ${C.line}`, borderRadius: 16, width: "100%", maxWidth: 480, maxHeight: "85vh", display: "flex", flexDirection: "column" }}>
      <div style={{ padding: "16px 18px", borderBottom: `1px solid ${C.line}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}><div className="tbcs-font-display" style={{ fontSize: 17, fontWeight: 700 }}>Commissioner: Update Data</div><button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}><X size={20} color={C.muted} /></button></div>
      <div style={{ padding: 18, overflowY: "auto" }}>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 10, lineHeight: 1.5 }}>Paste a race-update file (small) OR the Season 1 archive and tap Apply. Updates merge — you never need to paste everything at once. Everyone with the link sees it instantly.</div>
        <button onClick={copyTemplate} className="tbcs-font-body" style={{ fontSize: 12, fontWeight: 700, color: C.greenBright, background: "rgba(0,145,63,0.12)", border: `1px solid rgba(0,145,63,0.4)`, borderRadius: 8, padding: "6px 10px", marginBottom: 10, cursor: "pointer" }}>{copied ? "Copied current data ✓" : "Load current data as template"}</button>
        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Paste full payload JSON…" className="tbcs-font-mono tbcs-scrollbar" style={{ width: "100%", height: 220, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 8, color: C.text, fontSize: 11, padding: 10, resize: "vertical" }} />
        {error && <div style={{ color: C.red, fontSize: 12, marginTop: 8 }}>{error}</div>}
      </div>
      <div style={{ padding: 16, borderTop: `1px solid ${C.line}`, display: "flex", gap: 8 }}>
        <button onClick={onClose} className="tbcs-font-body" style={{ flex: 1, padding: "10px", borderRadius: 8, background: C.panel2, color: C.muted, border: `1px solid ${C.line}`, cursor: "pointer", fontWeight: 700 }}>Cancel</button>
        <button onClick={handleApply} className="tbcs-font-body" style={{ flex: 1, padding: "10px", borderRadius: 8, background: C.green, color: "#fff", border: "none", cursor: "pointer", fontWeight: 700 }}>Apply Update</button>
      </div>
    </div>
  </div>);
}

/* ================= APP ================= */
function App() {
  const [data, setData] = useState(SEED_PAYLOAD);
  const [season, setSeason] = useState(SEED_PAYLOAD.currentSeason || "2");
  const [tab, setTab] = useState("tower");
  const [selectedRace, setSelectedRace] = useState((SEED_PAYLOAD.seasons["2"].tracks.length) - 1);
  const [modal, setModal] = useState(null); // {pid, season}
  const [adminOpen, setAdminOpen] = useState(false);
  const [seasonMenu, setSeasonMenu] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState("");

  useEffect(() => {
    (async () => {
      try { const res = await window.storage.get(STORAGE_KEY, true);
        if (res && res.value) { const parsed = JSON.parse(res.value); setData(parsed); setSelectedRace(parsed.seasons["2"].tracks.length - 1); }
      } catch (e) {}
      setLoaded(true);
    })();
  }, []);

  const applyUpdate = useCallback(async (patch) => {
    try {
      const merged = deepMerge(data, patch);
      await window.storage.set(STORAGE_KEY, JSON.stringify(merged), true);
      setData(merged);
      if (merged.seasons && merged.seasons["2"] && merged.seasons["2"].tracks) setSelectedRace(merged.seasons["2"].tracks.length - 1);
      setAdminOpen(false);
      setToast("Data updated — everyone with the link sees it now."); setTimeout(() => setToast(""), 3500);
    } catch (e) { setToast("Update failed to save."); setTimeout(() => setToast(""), 3500); }
  }, [data]);

  const registry = useMemo(() => buildRegistry(data), [data]);
  const historical = season === "1";
  const seasonObj = data.seasons[season];
  const prevMap = data.seasons["2"].prevMap || {};
  const tabs = historical ? [{ key: "tower", label: "Tower" }, { key: "chase", label: "Chase" }, { key: "leaders", label: "Leaders" }]
                          : [{ key: "tower", label: "Tower" }, { key: "chase", label: "Chase" }, { key: "stage", label: "Stage" }, { key: "leaders", label: "Leaders" }];
  const activeTab = tabs.find(t => t.key === tab) ? tab : "tower";
  const heroTitle = historical ? "SEASON 1 ARCHIVE" : { tower: "POINTS STANDINGS", chase: "CHASE TRACKER", stage: "STAGE POINTS", leaders: "LEAGUE LEADERS" }[activeTab];
  const openDriver = (pid, s) => setModal({ pid, season: s });

  return (<div className="tbcs-font-body" style={{ background: C.bg, minHeight: "100vh", color: C.text, paddingBottom: 90 }}>
    <GlobalStyle /><CheckeredBar />
    <div style={{ padding: "18px 16px 10px", display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
      <div style={{ minWidth: 0 }}>
        <div className="tbcs-font-body" style={{ color: C.gold, fontSize: 12, fontWeight: 700, letterSpacing: "0.12em", textTransform: "uppercase" }}>Trips B Cup Series</div>
        <div className="tbcs-font-display" style={{ fontSize: 30, fontWeight: 700, fontStyle: "italic", lineHeight: 1.05 }}>{heroTitle}</div>
      </div>
      <div style={{ position: "relative", flexShrink: 0 }}>
        <button onClick={() => setSeasonMenu(!seasonMenu)} className="tbcs-font-body" style={{ display: "flex", alignItems: "center", gap: 6, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 10px", cursor: "pointer", color: C.text, fontWeight: 700, fontSize: 11.5 }}>
          <span style={{ color: C.muted, fontSize: 9.5, textTransform: "uppercase", letterSpacing: "0.05em" }}>Archive</span>
          <span>{data.seasonList.find(s => s.id === season)?.label || "Season " + season}</span>
          <ChevronDown size={14} color={C.muted} />
        </button>
        {seasonMenu && (<div style={{ position: "absolute", right: 0, top: "calc(100% + 6px)", background: C.panel, border: `1px solid ${C.line}`, borderRadius: 10, overflow: "hidden", zIndex: 40, minWidth: 150, boxShadow: "0 8px 24px rgba(0,0,0,0.5)" }}>
          <div style={{ padding: "8px 12px", fontSize: 9.5, color: C.muted, textTransform: "uppercase", letterSpacing: "0.06em", fontWeight: 700, borderBottom: `1px solid ${C.line}` }}>Season Archives</div>
          {data.seasonList.map(s => (<button key={s.id} onClick={() => { setSeason(s.id); setTab("tower"); setSeasonMenu(false); }} className="tbcs-font-body" style={{ width: "100%", textAlign: "left", padding: "10px 12px", background: season === s.id ? C.panel2 : "transparent", color: season === s.id ? C.gold : C.text, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 13, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            {s.label}{s.complete && <span style={{ fontSize: 9, color: C.muted, fontWeight: 600 }}>DONE</span>}</button>))}
        </div>)}
      </div>
    </div>

    <div style={{ display: "flex", padding: "4px 16px 14px", gap: 8 }}>
      {tabs.map(t => (<button key={t.key} onClick={() => setTab(t.key)} className="tbcs-font-body" style={{ flex: 1, padding: "10px 4px", borderRadius: 9, fontWeight: 700, fontSize: 12, cursor: "pointer", background: activeTab === t.key ? C.gold : C.panel, color: activeTab === t.key ? "#111" : C.text, border: `1px solid ${activeTab === t.key ? C.gold : C.line}` }}>{t.label.toUpperCase()}</button>))}
    </div>

    <div style={{ padding: "0 14px 14px", maxWidth: 640, margin: "0 auto" }} onClick={() => seasonMenu && setSeasonMenu(false)}>
      {!loaded ? (<div style={{ padding: 40, textAlign: "center", color: C.muted, fontSize: 13 }}>Loading…</div>) : (<>
        {activeTab === "tower" && <TowerTab season={seasonObj} historical={historical} prevMap={prevMap} selectedRace={selectedRace} setSelectedRace={setSelectedRace} onOpenDriver={openDriver} />}
        {activeTab === "chase" && <ChaseTab season={seasonObj} historical={historical} onOpenDriver={openDriver} />}
        {activeTab === "stage" && !historical && <StageTab season={seasonObj} onOpenDriver={openDriver} />}
        {activeTab === "leaders" && <LeadersTab season={seasonObj} historical={historical} onOpenDriver={openDriver} />}
      </>)}
    </div>

    <button onClick={() => setAdminOpen(true)} style={{ position: "fixed", bottom: 20, right: 20, width: 52, height: 52, borderRadius: 999, background: C.gold, border: "none", boxShadow: "0 4px 14px rgba(255,201,51,0.5)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", zIndex: 30 }}><Settings size={22} color="#111" /></button>
    {toast && (<div style={{ position: "fixed", bottom: 82, left: "50%", transform: "translateX(-50%)", background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 10, padding: "8px 14px", fontSize: 12, color: C.text, zIndex: 40, whiteSpace: "nowrap" }}>{toast}</div>)}
    {modal && <DriverModal pid={modal.pid} registry={registry} initialSeason={modal.season} data={data} onClose={() => setModal(null)} />}
    {adminOpen && <AdminModal data={data} onClose={() => setAdminOpen(false)} onApply={applyUpdate} />}
  </div>);
}


    // GitHub Pages has no window.storage; provide a localStorage-backed shim so the
    // commissioner's local previews work. Shared updates happen by replacing this file.
    if (typeof window.storage === "undefined") {
      window.storage = {
        get: async (k) => { try { const v = localStorage.getItem(k); return v ? { value: v } : null; } catch(e){ return null; } },
        set: async (k, v) => { try { localStorage.setItem(k, v); } catch(e){} return { value: v }; },
      };
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
